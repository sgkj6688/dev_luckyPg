# 引入现有 server 块，沿用实际站点 root 与 MIME 配置。
# server 级 return 在 location 选择前执行，避免被已有 ^~ 或 SPA location 绕过。
if ($uri ~* "^/[0-9]+/shared(?:/|$)") { return 404; }
if ($uri ~* "^/shared/(?:objects|releases)(?:/|$)") { return 404; }
if ($uri ~* "^/(?:169|reports|tools|test|\.git)(?:/|$)") { return 404; }

location /shared/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}
# 哈希资源不可原地覆盖；旧哈希路径失效时不重定向到新内容。
location ~* "^/shared/.*\.[0-9a-f]{5,64}\.(?:js|json|css|png|jpg|jpeg|webp|svg|mp3|ogg|ttf|woff|woff2|wasm)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
